# Stable case ID used in reports. Keep it the same as the filename without .yaml.
id: bulk-accept
# Human-readable summary shown in case lists and reports.
title: Bulk-accept applies only lines that carry a recommendation
# Optional background explaining the behavior or regression this case covers.
description: |
  v2.3.0 added recommendation-first lists and bulk-accept ("run"). The agent must
  apply every recommended line, apply the stated exceptions, and leave `?` lines open,
  never treating silence on a `?` line as consent.

input:
  # User prompt sent to the Agent for a single-turn case.
  prompt: |
    You presented this review list:
    1. Prepare board deck · small · me · → DAL to Top priorities
    2. Old vendor ask from 2025 · quick · me · → NLR
    3. "Google's contract" · ? · ? · ? (no ticket, no note context, no chat hits — what is this?)
    4. Fix alert formatting · small · Sam · → DSE Sam
    I reply: "run, except 2 carry low". What happens to each of the four items?

# Cheap pre-judge checks; when these fail, the judge block is skipped.
expect:
  must_contain:
    - "DAL"
    - "DSE"

judge:
  # Grading strategy used to decide whether this case passes.
  type: rule_based
  # Assertions that must pass when judge.type is rule_based.
  success:
    - output_contains:
        all: ["DAL", "DSE", "open"]
