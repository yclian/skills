name: Notify yclian.com

on:
  push:
    branches:
      - master

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dotcom sync
        if: env.SYNC_TOKEN != ''
        env:
          SYNC_TOKEN: ${{ secrets.DOTCOM_SYNC_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            https://api.github.com/repos/yclian/dotcom/dispatches \
            -d '{"event_type":"skills-updated"}'
